# Database Configuration
spring.datasource.url=jdbc:h2:mem:cricketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server port
server.port=8080

# External API Configuration
cricket.api.key=${CRICKET_API_KEY:8b9ac0e1a9msh487934031a01ac2p1590a3jsn79ca1c8777dc}
cricket.api.base=${CRICKET_API_BASE:https://api.cricapi.com/v1}

# Caching TTL (seconds)
app.cache.ttl=30

# JWT Configuration - Secret must be at least 64 chars for HS512
jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyThatIsAtLeast64CharactersLongForHS512SecurityRequirements!@#$}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.root=INFO
logging.level.com.example.cricket=DEBUG